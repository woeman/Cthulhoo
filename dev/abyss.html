<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Abyss Playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e4d9bd; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
  canvas.abyss { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; left: 8px; bottom: 8px; background: rgb(0 0 0 / .6); padding: 8px 10px; border-radius: 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; width: min(420px, calc(100vw - 16px)); box-sizing: border-box; }
  #panel input { width: 100%; }
  #panel.hidden { display: none; }
</style>
</head>
<body>
<div id="panel"></div>
<script type="module">
  // Query parameters, all optional:
  //   depth, eye, madness, tension, flash   starting slider values
  //   clean=1        hide the sliders
  //   scale=1.6      pin the render scale (render px per CSS px), as the game's ?scale does
  //   time=12.5      freeze the shader clock at this many seconds (repeatable screenshots)
  //   visit=0.8      call summon() so the things in the dark come close
  //   look=x,y       where the Eye looks (lookAt)
  //   reduced=1      reduced motion
  import { Abyss } from '../src/render/abyss.ts';
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && q.get(k) !== '' && Number.isFinite(Number(q.get(k))) ? Number(q.get(k)) : d);
  const abyss = new Abyss(document.body, { reducedMotion: q.get('reduced') === '1', pinScale: num('scale', 0) });
  const panel = document.getElementById('panel');
  if (q.has('clean')) panel.classList.add('hidden');
  // The fields poked below (clock, last, visit, gaze, pupil, nextBlink, eye) are the
  // renderer's private state; this page reaches in so screenshots are repeatable.
  if (q.has('time')) {
    // Freeze everything: the shader clock, and every eased value (each frame sees dt = 0).
    const at = num('time', 0);
    const frame = abyss.frame.bind(abyss);
    abyss.frame = (now) => {
      abyss.last = now;
      abyss.clock = at;
      frame(now);
    };
    abyss.nextBlink = Infinity;
    abyss.nextGlance = Infinity;
    abyss.pupil = num('pupil', 0.3);
    abyss.wasOpen = true; // or the first frame opens the pupil wide, and with dt = 0 it stays so
  }
  if (q.has('visit')) {
    abyss.summon(num('visit', 0));
    abyss.visit = num('visit', 0);
    if (q.has('time')) abyss.noticeAt = -1e9; // no brightening motes in a still
  }
  if (q.has('look')) {
    const [x, y] = q.get('look').split(',').map(Number);
    abyss.lookAt(x || 0, y || 0);
    abyss.gaze = { x: x || 0, y: y || 0 };
  }
  const controls = [
    ['depth', -60, 9000, 10, num('depth', -32), (v) => abyss.jumpTo(v)],
    // Snap the Eye as well as aiming it, so a screenshot need not wait for it to open.
    ['eye', 0, 1, 0.01, num('eye', 0), (v, first) => { abyss.setEye(v); if (first) abyss.eye = v; }],
    ['madness', 0, 1, 0.01, num('madness', 0), (v) => (abyss.madness = v)],
    ['tension', 0, 1, 0.01, num('tension', 0), (v) => (abyss.tension = v)],
    ['flash', 0, 1, 0.01, num('flash', 0), (v) => abyss.pulse(v)],
  ];
  for (const [name, min, max, step, val, set] of controls) {
    const label = document.createElement('label'); label.textContent = name;
    const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: val });
    const out = document.createElement('output'); out.textContent = val;
    input.addEventListener('input', () => { out.textContent = input.value; set(Number(input.value), false); });
    panel.append(label, input, out);
    set(val, true);
  }
  window.abyss = abyss;
  abyss.start();
</script>
</body>
</html>
