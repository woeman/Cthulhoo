# Plays the published game once on GitHub's machines, the way a visitor would:
# the title on a phone and a desktop, a whole daily dive, the riddle, and, when
# the site was built with the relay, a cult joined by its link and a séance
# between two phones. Run it from the Actions tab whenever you like; the result
# is on the run's summary page, with screenshots under Artifacts.
name: Check the live game

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7i1b4w]
    paths: [.github/workflows/live-check.yml, dev/live-check.cjs]

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Play the live game
        env:
          NODE_PATH: ${{ runner.temp }}/node_modules
          BASE: https://woeman.github.io/Cthulhoo/
        run: node dev/live-check.cjs live-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-screenshots
          path: live-check
