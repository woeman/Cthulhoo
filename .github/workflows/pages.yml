# Checks every pull request, and publishes main to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild once the relay is deployed, so the site learns its address.
  workflow_run:
    workflows: [Deploy the relay]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Séances across phones and the cult board need the relay's address
      # (see relay.yml). A repository variable RELAY_URL wins; otherwise it is
      # looked up from the Cloudflare secrets. Without either, the game is
      # built for pass-and-play only.
      - name: Find the relay
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="$RELAY_URL"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$sub" ] && url="https://cthulhoo-relay.$sub.workers.dev"
          fi
          if [ -n "$url" ]; then
            echo "VITE_RELAY_URL=$url" >> "$GITHUB_ENV"
            echo "::notice::Building with the relay at $url"
          else
            echo "::notice::No relay yet: the Séance is built for pass-and-play only."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
