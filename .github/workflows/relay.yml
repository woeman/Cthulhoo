# Deploys the surface relay (worker/: séance rooms and cult boards) to
# Cloudflare Workers on the free plan.
# One-time setup, in Settings > Secrets and variables > Actions:
#   CLOUDFLARE_API_TOKEN   a token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Workers & Pages page of the dashboard
# Until both secrets exist, this workflow only leaves a note and stops.
name: Deploy the relay

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/party/**'
      - 'src/game/matcher.ts'
      - 'src/game/daily.ts'
      - 'src/game/types.ts'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The relay is not deployed yet. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, then run this workflow again."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npm ci
      - name: Check the types
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npx tsc --noEmit -p .
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - name: Say hello to it
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://cthulhoo-relay.$sub.workers.dev"
          curl -fsS --retry 5 --retry-delay 3 "$url/health"
          echo "::notice::The relay is live at $url"
